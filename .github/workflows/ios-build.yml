
name: Frostbite iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS device app
        run: |
          xcodebuild \
            -project Frostbite.xcodeproj \
            -scheme Frostbite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*/Build/Products/Release-iphoneos/Frostbite.app' \
            -print -quit)

          test -n "$APP_PATH"

          cp -R "$APP_PATH" Payload/Frostbite.app

          zip -r Frostbite.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Frostbite-IPA
          path: Frostbite.ipa
