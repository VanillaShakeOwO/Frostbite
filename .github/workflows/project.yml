name: Frostbite
options:
  bundleIdPrefix: dev.frostbite
  deploymentTarget:
    iOS: "17.0"
targets:
  Frostbite:
    type: application
    platform: iOS
    sources:
      - Frostbite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frostbite.ios
        PRODUCT_NAME: Frostbite
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frostbite
        CODE_SIGNING_ALLOWED: NO
